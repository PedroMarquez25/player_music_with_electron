<html>

  <title>RealPlayer</title>
  <link rel="stylesheet" href="../styles/home.css">
</head>
<body class="container-windows">

          viewBox="0 0 512 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

        <p class="title-item">Songs</p>
      </button>
    </div>
    <div class="container-main">
      <p class="title-selected" id="title-selected">Home</p>
      <div class="container-home" id="container_home">
        <div class="temp-home">
          <div class="container_select_directory">
            <h3 class="title-item-home">Carpeta seleccionada</h3>
            <p class="carpeta-selcted" id="carpeta-selcted">C:/Users/PC/Music: </p>
            <ul class="archivos_ruta" id="archivos_ruta"></ul>
            <button id="selectCarpeta" class="btnCambiarImg">Seleccionar carpetas</button>
          </div>
          <div class="container-imagen-user">
            <h3 class="title-item-home">Imagen de usuario</h2>
              <img id="img-user" class="img-user" src="../assets/Iron-man-endgame.jpg" alt="">
              <button id="btnCambiarImg" class="btnCambiarImg">Cambiar imagen</button>
          </div>
        </div>
      </div>
      <div class="container-lista-canciones container-hide" id="container_lista">
        <ul id="lista">
        </ul>
      </div>
    </div>
  </div>
  <div class="barra-reproductor" id="barra_reproductor">
    <div class="container-hide" id="container-caratula-expandida">
      <button class="btn-hide-reproductor" id="btn-hide-reproductor">
        <svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

      <p class="title-reproductor-music-expandido" id="title-reproductor-music-expandido"></p>
    </div>
    <audio class="audio" id="audio" src="" controls></audio>
    <div class="botton-btns" id="botton-btns">
      <div class="container-caratula" id="container-caratula">
        <img src="../assets/Iron-man-endgame.jpg" alt="" id="caratula" class="caratula">
        <p class="title-reproductor-music" id="title_reproductor_music"></p>
      </div>

      <div class="btns" id="btns">
        <button class="btnBack" id="btnBack">
          <svg class="icon-arrow" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 384 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path fill="rgb(255, 255, 255)"
              d="M363 36.8c-12.9-7-28.7-6.3-41 1.8L64 208.1 64 64c0-17.7-14.3-32-32-32S0 46.3 0 64L0 448c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144.1 258 169.6c12.3 8.1 28 8.8 41 1.8s21-20.5 21-35.2l0-368c0-14.7-8.1-28.2-21-35.2z" />

        <button class="btnStop" id="btnStop">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 384 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path fill="rgb(255, 255, 255)"
              d="M48 32C21.5 32 0 53.5 0 80L0 432c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48L48 32zm224 0c-26.5 0-48 21.5-48 48l0 352c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48l-64 0z" />

            <path fill="rgb(255, 255, 255)"
              d="M21 36.8c12.9-7 28.7-6.3 41 1.8L320 208.1 320 64c0-17.7 14.3-32 32-32s32 14.3 32 32l0 384c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-144.1-258 169.6c-12.3 8.1-28 8.8-41 1.8S0 454.7 0 440L0 72C0 57.3 8.1 43.8 21 36.8z" />

      </div>
      <div class="btns-adicionales" id="btns-adicionales">
      </div>
    </div>
  </div>
</body>
<script src="../scripts/renderer.js"></script>
</html>
